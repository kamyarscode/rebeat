services:
  postgres:
    container_name: rebeat-postgres
    image: postgres
    restart: always
    # Local throwaway container; these match the DATABASE_URL in the README.
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: rebeat
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
